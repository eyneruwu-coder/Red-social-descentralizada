<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Descentralizada</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Red Descentralizada</h1>
  
  <!-- IDENTIDAD PERMANENTE -->
  <div class="seccion">
    <label>Tu número de identificación:</label>
    <input type="text" id="miIdentificador" placeholder="Ej: 0987654321">
    <button id="conectarBtn">Activar identidad</button>
    <p class="info">Activo: <span id="tuId" class="resaltado">—</span></p>
    <p class="ayuda">Tu número se guarda automáticamente, no tendrás que escribirlo de nuevo</p>
  </div>

  <!-- CONECTAR CON OTRO -->
  <div class="seccion">
    <label>Conectar con:</label>
    <input type="text" id="idDestino" placeholder="Escribe su número">
    <button id="enlazarBtn">Conectar</button>
    <div id="estadoConexion"></div>
  </div>

  <!-- LLAMADAS -->
  <div class="seccion">
    <h3>Llamadas</h3>
    <button id="llamarBtn" disabled>📞 Llamar al contacto</button>
    <div id="llamadaEnCurso" class="oculto">
      <p id="estadoLlamada">Llamando...</p>
      <button id="colgarBtn">📵 Colgar</button>
      <audio id="audioRemoto" autoplay playsinline>
    </div>
    <div id="llamadaEntrante" class="oculto">
      <p id="quienLlama"></p>
      <button id="responderBtn">✅ Responder</button>
      <button id="rechazarBtn">❌ Rechazar</button>
    </div>
  </div>

  <!-- CHAT -->
  <div class="seccion">
    <h3>Conectados: <span id="contador">0</span></h3>
    <ul id="listaConectados"></ul>
    <p id="pendientesInfo" class="ayuda"></p>
  </div>

  <div class="seccion">
    <textarea id="mensajeInput" placeholder="Escribe un mensaje..."></textarea>
    <button id="publicarBtn">Enviar</button>
    
    <div class="audio-zona">
      <button id="grabarBtn">🎙️ Grabar nota</button>
      <button id="detenerBtn" disabled>⏹️ Detener</button>
      <button id="enviarAudioBtn" disabled>📤 Enviar audio</button>
    </div>
  </div>

  <div class="seccion">
    <h3>Historial:</h3>
    <div id="muro"></div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
